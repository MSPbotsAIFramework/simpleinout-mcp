services:
  simpleinout-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: simpleinout-mcp:latest
    container_name: simpleinout-mcp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - MCP_HTTP_PORT=8080

volumes: {}
